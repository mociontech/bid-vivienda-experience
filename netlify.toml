[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/display"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/controller"
  to = "/controller.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

