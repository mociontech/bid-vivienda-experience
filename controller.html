  total:{icon:'%',title:'Déficit habitacional total',text:'Proporción de viviendas con déficit cuantitativo o cualitativo sobre el total de viviendas del país.'},
  quantitative:{icon:'⌂',title:'Déficit cuantitativo',text:'Hogares que necesitan una nueva vivienda.'},
  qualitative:{icon:'⌁',title:'Déficit cualitativo',text:'Viviendas que requieren mejoras en materiales, estructura, servicios o habitabilidad.'},
  financing:{icon:'$',title:'Cartera Hipotecaria como Porcentaje del PIB',text:'Profundidad del mercado hipotecario medida como cartera hipotecaria sobre PIB.'}
};
const subregions=['Todas','México','Centroamérica','Caribe','Suramérica'];
const defaultState={category:'total',mode:'regional',countryIso3:'COL',subregion:'Todas'};
const state={...defaultState};
const previewParams=new URLSearchParams(location.search);
let flowMode=previewParams.get('flow')==='financing'?'financing':'deficit';
let screenMode=previewParams.get('screen')==='landing'?'landing':'selector';
if(flowMode==='financing')state.category='financing';
let firebaseStateRef=null;
let firebaseConnectedRef=null;
let firestoreDb=null;
let pendingCategory='';
const INTERACTION_TIMEOUT_MS=120000;
let currentViewSegment=null;
let viewTimeoutId=null;

function setStatus(title,detail,online=false){const el=document.getElementById('status');el.classList.toggle('online',online);el.innerHTML='<strong>'+title+'</strong><span>'+detail+'</span>'}
function normalizeState(next={}){return{...defaultState,category:labels[next.category]?next.category:state.category}}
function applyState(next={},renderOnly=false){Object.assign(state,normalizeState(next));flowMode=state.category==='financing'?'financing':'deficit';if(!renderOnly)pendingCategory=state.category;render();if(!renderOnly)sendState()}
function firebaseOptions(){return window.BID_FIREBASE||{}}
function hasFirebaseConfig(){const o=firebaseOptions();return Boolean(o.apiKey&&o.projectId&&o.databaseURL)}
function ensureFirebaseApp(){if(!firebase.apps.length)firebase.initializeApp(firebaseOptions())}
function firebaseSessionPath(){const raw=(firebaseOptions().sessionId||'maqueta-1-bid').toString();const safe=raw.replace(/[.#$\/\[\]]/g,'-').slice(0,80)||'maqueta-1-bid';return 'live_reactions/bid-map-state-'+safe}
function decodeRealtimeState(raw){if(!raw)return null;if(typeof raw.e==='string'){try{return JSON.parse(raw.e)}catch(_){return null}}return raw}
function realtimePayload(){return{e:JSON.stringify(normalizeState(state)),ts:firebase.database.ServerValue.TIMESTAMP}}
function sendState(){if(firebaseStateRef){firebaseStateRef.set(realtimePayload()).then(()=>{pendingCategory='';setStatus('Conectado','sincronizado con Firebase',true)}).catch(err=>{setStatus('Error Firebase',err.message,false);render()})}render()}
function connect(){if(previewParams.get('preview')==='1'){setStatus('Vista previa','sin Firebase',false);return}if(!hasFirebaseConfig()){setStatus('Configura Firebase','edita firebase-config.js',false);return}if(!window.firebase||!firebase.database){setStatus('SDK Firebase no cargó','revisa internet',false);return}try{ensureFirebaseApp();const db=firebase.database();firebaseStateRef=db.ref(firebaseSessionPath());firebaseConnectedRef=db.ref('.info/connected');firebaseConnectedRef.on('value',snap=>setStatus(snap.val()?'Conectado':'Sin internet',snap.val()?'Firebase Realtime Database':'esperando conexión',Boolean(snap.val())));firebaseStateRef.on('value',snap=>{const next=decodeRealtimeState(snap.val());if(next){if(pendingCategory&&next.category!==pendingCategory)return;applyState(next,true)}else sendState()},err=>setStatus('Error Firebase',err.message,false))}catch(err){setStatus('Error Firebase',err.message,false)}}
function getFirestoreDb(){if(previewParams.get('preview')==='1'||!hasFirebaseConfig()||!window.firebase||!firebase.firestore)return null;try{ensureFirebaseApp();if(!firestoreDb)firestoreDb=firebase.firestore();return firestoreDb}catch(err){console.warn('Firestore no disponible',err);return null}}
function newAnalyticsSessionId(){return(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'session-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function analyticsSessionId(nowMs=Date.now()){const idKey='maqueta1_bid_session_id';const lastKey='maqueta1_bid_session_last_activity';try{let id=localStorage.getItem(idKey);const last=Number(localStorage.getItem(lastKey)||0);if(!id||!last||nowMs-last>INTERACTION_TIMEOUT_MS){id=newAnalyticsSessionId();localStorage.setItem(idKey,id)}localStorage.setItem(lastKey,String(nowMs));return id}catch(_){return newAnalyticsSessionId()}}
function activeViewMeta(){
  const optionByCategory={
    qualitative:['Deficit_Integral_2023','Deficit_cualitativo','Déficit cualitativo'],
    quantitative:['Deficit_Integral_2023','Deficit_cuantitativo','Déficit cuantitativo'],
    total:['Deficit_Integral_2023','Deficit_habitacional_total','Déficit habitacional total'],
    financing:['Financiamiento','Cartera_Hipotecaria_PIB','Cartera Hipotecaria como Porcentaje del PIB']
  };
  const data=optionByCategory[state.category]||optionByCategory.total;
  return{flowId:data[0],optionId:data[1],buttonText:data[2],category:state.category,flow:flowMode};
}
function analyticsMeta(button){
  const category=button.dataset.category||state.category;
  const flow=button.dataset.flow||button.dataset.enterFlow||flowMode;
  const isFinancing=category==='financing'||flow==='financing';
  const flowId=isFinancing?'Financiamiento':'Deficit_Integral_2023';
  const optionByCategory={
    qualitative:'Deficit_cualitativo',
    quantitative:'Deficit_cuantitativo',
    total:'Deficit_habitacional_total',
    financing:'Cartera_Hipotecaria_PIB'
  };
  const optionId=button.dataset.category?optionByCategory[button.dataset.category]:(isFinancing?'Boton_Financiamiento':'Boton_Deficit_Integral_2023');
  const cleanText=(button.innerText||button.textContent||labels[category]||'').replace(/\s+/g,' ').trim();
  return{category,flow,flowId,optionId,buttonText:cleanText||optionId.replace(/_/g,' ')};
}
function viewDocRefs(db,utcDate,meta){
  const dateDoc=db.collection('Maqueta1_BID').doc(utcDate);
  const flowSummaryDoc=dateDoc.collection(meta.flowId).doc('_resumen');
  const optionDoc=dateDoc.collection(meta.flowId).doc(meta.optionId);
  return{dateDoc,flowSummaryDoc,optionDoc};
}
function writeViewDuration(segment,endMs,reason){
  const db=getFirestoreDb();
  if(!db||!segment)return;
  const durationMs=Math.max(0,endMs-segment.startMs);
  if(durationMs<1000)return;
  const end=new Date(endMs);
  const endIso=end.toISOString();
  const serverTimestamp=firebase.firestore.FieldValue.serverTimestamp();
  const seconds=Math.round(durationMs/100)/10;
  const refs=viewDocRefs(db,segment.utcDate,segment.meta);
  const viewId=segment.startIso.slice(11,23).replace(/[:.]/g,'-')+'_'+segment.meta.optionId+'_'+segment.sessionId.slice(0,8);
  const viewDoc=refs.optionDoc.collection('views').doc(viewId);
  const batch=db.batch();
  batch.set(refs.dateDoc,{dateUtc:segment.utcDate,totalViewSeconds:firebase.firestore.FieldValue.increment(seconds),updatedAtServer:serverTimestamp,updatedAtUtc:endIso},{merge:true});
  batch.set(refs.flowSummaryDoc,{flowGroup:segment.meta.flowId,totalViewSeconds:firebase.firestore.FieldValue.increment(seconds),updatedAtServer:serverTimestamp,updatedAtUtc:endIso},{merge:true});
  batch.set(refs.optionDoc,{
    optionId:segment.meta.optionId,
    optionLabel:segment.meta.buttonText,
    category:segment.meta.category,
    flow:segment.meta.flow,
    totalViewSeconds:firebase.firestore.FieldValue.increment(seconds),
    lastViewSeconds:seconds,
    lastViewEndedAtServer:serverTimestamp,
    lastViewEndedAtUtc:endIso,
    lastSessionId:segment.sessionId
  },{merge:true});
  batch.set(viewDoc,{
    eventType:'view_duration',
    flowGroup:segment.meta.flowId,
    optionId:segment.meta.optionId,
    optionLabel:segment.meta.buttonText,
    category:segment.meta.category,
    flow:segment.meta.flow,
    sessionId:segment.sessionId,
    startedAtUtc:segment.startIso,
    endedAtUtc:endIso,
    utcDate:segment.utcDate,
    durationMs,
    durationSeconds:seconds,
    closeReason:reason,
    pagePath:location.pathname,
    browserTimezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null
  });
  batch.commit().catch(err=>console.warn('No se pudo guardar el tiempo de vista en Firestore',err));
}
function scheduleViewTimeout(){
  clearTimeout(viewTimeoutId);
  if(!currentViewSegment)return;
  viewTimeoutId=setTimeout(()=>{
    const ended=Date.now();
    writeViewDuration(currentViewSegment,ended,'timeout_2_minutes');
    currentViewSegment=null;
  },INTERACTION_TIMEOUT_MS);
}
function startViewSegment(meta,sessionId,now){
  currentViewSegment={meta,sessionId,startMs:now.getTime(),startIso:now.toISOString(),utcDate:now.toISOString().slice(0,10)};
  scheduleViewTimeout();
}
function trackButtonPress(button,extra={}){
  const db=getFirestoreDb();
  if(!db)return;
  const now=new Date();
  const sessionId=analyticsSessionId(now.getTime());
  const utcIso=now.toISOString();
  const utcDate=utcIso.slice(0,10);
  const utcTime=utcIso.slice(11,19);
  const meta=analyticsMeta(button);
  if(currentViewSegment)writeViewDuration(currentViewSegment,now.getTime(),currentViewSegment.sessionId===sessionId?'changed_selection':'session_reset_after_2_minutes');
  startViewSegment(activeViewMeta(),sessionId,now);
  const serverTimestamp=firebase.firestore.FieldValue.serverTimestamp();
  const increment=firebase.firestore.FieldValue.increment(1);
  const eventId=utcIso.slice(11,23).replace(/[:.]/g,'-')+'_'+meta.optionId+'_'+sessionId.slice(0,8);
  const payload={
    eventType:'button_press',
    buttonText:meta.buttonText,
    buttonFlow:meta.flow,
    buttonCategory:meta.category,
    flowGroup:meta.flowId,
    optionId:meta.optionId,
    currentFlow:flowMode,
    currentCategory:state.category,
    currentCategoryLabel:labels[state.category]||state.category,
    screenMode,
    sessionId,
    createdAtServer:serverTimestamp,
    createdAtUtc:utcIso,
    utcDate,
    utcTime,
    browserTimezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,
    timezoneOffsetMinutes:now.getTimezoneOffset(),
    pagePath:location.pathname,
    pageUrl:location.href.split('#')[0],
    referrer:document.referrer||null,
    viewport:{width:innerWidth,height:innerHeight,devicePixelRatio:devicePixelRatio||1},
    screen:{width:screen.width,height:screen.height},
    userAgent:navigator.userAgent,
    ...extra
  };
  const {dateDoc,flowSummaryDoc,optionDoc}=viewDocRefs(db,utcDate,meta);
  const clickDoc=optionDoc.collection('clicks').doc(eventId);
  const batch=db.batch();
  batch.set(dateDoc,{dateUtc:utcDate,totalClicks:increment,updatedAtServer:serverTimestamp,updatedAtUtc:utcIso},{merge:true});
  batch.set(flowSummaryDoc,{flowGroup:meta.flowId,totalClicks:increment,updatedAtServer:serverTimestamp,updatedAtUtc:utcIso},{merge:true});
  batch.set(optionDoc,{optionId:meta.optionId,optionLabel:meta.buttonText,category:meta.category,flow:meta.flow,totalClicks:increment,lastClickAtServer:serverTimestamp,lastClickAtUtc:utcIso,lastSessionId:sessionId},{merge:true});
  batch.set(clickDoc,payload);
  batch.commit().catch(err=>console.warn('No se pudo guardar la interacción en Firestore',err));
}
addEventListener('pagehide',()=>{if(currentViewSegment)writeViewDuration(currentViewSegment,Date.now(),'page_closed')});
function render(){
  document.body.dataset.category=state.category;
  document.body.dataset.flow=flowMode;
  document.body.dataset.screen=screenMode;
  document.querySelectorAll('button[data-flow]').forEach(btn=>btn.classList.toggle('active',btn.dataset.flow===flowMode));
  document.querySelectorAll('button[data-category]').forEach(btn=>btn.classList.toggle('active',btn.dataset.category===state.category));
  document.getElementById('deficitPanel').setAttribute('aria-hidden',flowMode!=='deficit');
  document.getElementById('financingPanel').setAttribute('aria-hidden',flowMode!=='financing');
  document.getElementById('currentSelection').textContent='Indicador enviado: '+labels[state.category];
}

document.querySelectorAll('button[data-category]').forEach(btn=>btn.onclick=()=>{applyState({category:btn.dataset.category});trackButtonPress(btn,{action:'select_category'})});
document.querySelectorAll('button[data-enter-flow]').forEach(btn=>btn.onclick=()=>{
  screenMode='selector';
  flowMode=btn.dataset.enterFlow;
  if(flowMode==='financing')applyState({category:'financing'});
  else if(state.category==='financing')applyState({category:'total'});
  render();
  trackButtonPress(btn,{action:'enter_flow'});
});
document.querySelectorAll('button[data-flow]').forEach(btn=>btn.onclick=()=>{
  flowMode=btn.dataset.flow;
  if(flowMode==='financing')applyState({category:'financing'});
  else if(state.category==='financing')applyState({category:'total'});
  else render();
  trackButtonPress(btn,{action:'select_flow'});
});
render();
connect();
</script>
</body>
</html>
