function indicatorYear(d){return state.category==='financing'?(d.financingYear||'Sin dato'):'2023'}
function dataStatus(d,c){return typeof d[c.field]==='number'?'Dato disponible':'Información no disponible'}
function regionalGeometry(feature){
 const inside=polygon=>polygon.some(ring=>ring.some(([lon,lat])=>lon>=-120&&lon<=-30&&lat>=-62&&lat<=36));
 const geometry=feature&&feature.geometry;
 if(!geometry)return null;
 if(geometry.type==='Polygon')return inside(geometry.coordinates)?feature:null;
 if(geometry.type!=='MultiPolygon')return null;
 const coordinates=geometry.coordinates.filter(inside);
 return coordinates.length?{...feature,geometry:{...geometry,coordinates}}:null;
}
function mapPathElement(feature,className,iso3=''){

 path.setAttribute('class',className);
 path.setAttribute('d',window.bidMapPath(feature));
 if(iso3){path.dataset.iso=iso3;path.id='map-'+iso3}
 return path;
}

async function loadMapGeometry(){
 const loading=document.getElementById('mapLoading');
 try{
  if(!window.d3||!window.topojson)throw new Error('No cargaron las librerías cartográficas');
  const [response,detailResponse]=await Promise.all([
   fetch(MAP_DATA_URL,{cache:'force-cache'}),
   fetch(MAP_DETAIL_DATA_URL,{cache:'force-cache'})
  ]);
  if(!response.ok||!detailResponse.ok)throw new Error('No fue posible descargar las siluetas cartograficas');
  const [topology,detailTopology]=await Promise.all([response.json(),detailResponse.json()]);
  const world=topojson.feature(topology,topology.objects.countries).features;
  const detailWorld=topojson.feature(detailTopology,detailTopology.objects.countries).features;
  const byNumericId=new Map(countries.map(country=>[Number(country.numericId),country]));
  const worldByNumericId=new Map(world.map(feature=>[Number(feature.id),feature]));
  const detailByNumericId=new Map(detailWorld.map(feature=>[Number(feature.id),feature]));
  const targetGeometries=topology.objects.countries.geometries.filter(geometry=>byNumericId.has(Number(geometry.id)));
  const targetFeatures=countries.map(country=>{
   const numericId=Number(country.numericId);
   const feature=worldByNumericId.get(numericId)||detailByNumericId.get(numericId);
   if(!feature)return null;
   feature.properties={...(feature.properties||{}),iso3:country.iso3};
   return feature;
  }).filter(Boolean);
  const detailTargetFeatures=countries.map(country=>{
   const feature=detailByNumericId.get(Number(country.numericId));
   if(!feature)return null;
   feature.properties={...(feature.properties||{}),iso3:country.iso3};
   return feature;
  }).filter(Boolean);
  const contextFeatures=[...CONTEXT_COUNTRY_IDS]
   .map(numericId=>worldByNumericId.get(numericId)||detailByNumericId.get(numericId))
   .filter(Boolean)
   .map(regionalGeometry)
   .filter(Boolean);
  caribbeanContextFeatures=[...CARIBBEAN_CONTEXT_IDS]
   .map(numericId=>detailByNumericId.get(numericId)||worldByNumericId.get(numericId))
   .filter(Boolean)
   .map(feature=>({...feature,properties:{...(feature.properties||{}),contextName:CARIBBEAN_CONTEXT_NAMES.get(Number(feature.id))||''}}));
  if(targetFeatures.length!==countries.length)throw new Error('La cartografía cargó '+targetFeatures.length+' de '+countries.length+' países');
  mapFeatureByIso=new Map(targetFeatures.map(feature=>[feature.properties.iso3,feature]));
  detailFeatureByIso=new Map(detailTargetFeatures.map(feature=>[feature.properties.iso3,feature]));
  const collection={type:'FeatureCollection',features:[...contextFeatures,...targetFeatures]};
  const projection=d3.geoMercator().precision(.08).fitExtent([[24,24],[956,676]],collection);
  const path=d3.geoPath(projection);
  const mergedOutline=topojson.merge(topology,targetGeometries);
  window.bidMapPath=path;
  const bounds=path.bounds(collection),sidePad=24,topPad=24,bottomPad=24;
  const x=bounds[0][0]-sidePad,y=bounds[0][1]-topPad,width=bounds[1][0]-bounds[0][0]+sidePad*2,height=bounds[1][1]-bounds[0][1]+topPad+bottomPad;
  const svg=document.getElementById('mapSvg');
  svg.setAttribute('viewBox',[x,y,width,height].map(value=>value.toFixed(2)).join(' '));
  svg.dataset.projection='Mercator';
  const referenceImage=document.getElementById('referenceMapImage');
  const referenceBorderImage=document.getElementById('referenceBorderImage');
  const imageX=bounds[0][0].toFixed(2),imageY=bounds[0][1].toFixed(2),imageWidth=(bounds[1][0]-bounds[0][0]).toFixed(2),imageHeight=(bounds[1][1]-bounds[0][1]).toFixed(2);
  [referenceImage,referenceBorderImage].forEach(image=>{image.setAttribute('x',imageX);image.setAttribute('y',imageY);image.setAttribute('width',imageWidth);image.setAttribute('height',imageHeight)});
  const contextGroup=document.getElementById('contextCountries');
  const countriesGroup=document.getElementById('countries');
  const outlineGroup=document.getElementById('continentOutline');
  contextGroup.replaceChildren(...contextFeatures.map(feature=>mapPathElement(feature,'country context-country')));
  countriesGroup.replaceChildren(...targetFeatures.map(feature=>mapPathElement(feature,'country target-country',feature.properties.iso3)));
  outlineGroup.replaceChildren(svgNode('path',{class:'continent-outline',d:path(mergedOutline)}));
  loading.hidden=true;
  bindMapInteractions();
  render();
 }catch(error){
  loading.textContent='No fue posible cargar el mapa de alta resolución. Revisa la conexión a internet.';
  loading.title=error.message;
  console.error(error);
 }
}
